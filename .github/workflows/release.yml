name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.y.z)'
        required: true

# A release in flight must never be cancelled mid-publish; a duplicate
# dispatch of the same version waits instead.
concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # contents: write pushes the version bump and tag; id-token: write is
    # required for `npm publish --provenance` (OIDC trusted publishing).
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Validate version
        # Reject anything but strict x.y.z before it is interpolated into
        # shell commands or burned into the npm registry.
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: '$VERSION' (expected strict x.y.z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Ensure npm CLI supports OIDC trusted publishing
        # Trusted publishing needs npm >= 11.5.1. Pinned rather than
        # npm@latest because the npm 12.0.0 global install drops `sigstore`,
        # which `--provenance` requires.
        run: npm install -g npm@11.18.0 && npm --version

      - name: Bump version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Publish to npm
        # npm versions are immutable; skip when a previous run already
        # published so a re-run can finish the tag and GitHub Release.
        run: |
          if [ -n "$(npm view omo-claude-auth@${{ steps.version.outputs.version }} version 2>/dev/null || true)" ]; then
            echo "omo-claude-auth@${{ steps.version.outputs.version }} already published, skipping npm publish"
          else
            npm publish --provenance --access public
          fi

      - name: Commit and tag
        # Runs after publish so a failed publish never leaves a tag pointing
        # at an unreleased version. `-f` and the tag-scoped force push make
        # re-runs idempotent without touching other refs.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --staged --quiet || git commit -m "${{ steps.version.outputs.version }}"
          git push origin HEAD
          git tag -f "${{ steps.version.outputs.version }}"
          git push --force origin "refs/tags/${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.version }} already exists, skipping"
          else
            gh release create "${{ steps.version.outputs.version }}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
